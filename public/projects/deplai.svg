  <text x="150" y="592" font-family="Consolas, monospace" font-size="24" letter-spacing="4" fill="#ffbf73">MULTI AGENT DEVSECOPS ORCHESTRATION</text>
  <text x="150" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#8b949e">Repository analysis, Terraform planning, and automated cloud delivery</text>
