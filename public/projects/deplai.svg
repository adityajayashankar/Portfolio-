  <text x="826" y="208" font-family="Consolas, monospace" font-size="18" fill="#828b96">apply infra</text>
  <rect x="190" y="222" width="136" height="8" rx="4" fill="#fff" fill-opacity="0.11" />
  <rect x="508" y="222" width="116" height="8" rx="4" fill="#fff" fill-opacity="0.11" />
  <rect x="826" y="222" width="102" height="8" rx="4" fill="#fff" fill-opacity="0.11" />
  <path d="M400 217h72M714 217h90" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" />
  <path d="M472 217l20 -20M472 217l20 20M804 217l20 -20M804 217l20 20" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
