  <rect x="78" y="78" width="1044" height="564" rx="28" fill="none" stroke="#fff" stroke-opacity="0.14" />
  <rect x="126" y="128" width="948" height="332" rx="24" fill="url(#panel)" stroke="#fff" stroke-opacity="0.09" />
  <rect x="166" y="174" width="234" height="86" rx="18" fill="#0b0f15" stroke="#fff" stroke-opacity="0.08" />
